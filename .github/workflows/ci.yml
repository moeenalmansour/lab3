# Lab 2: test every pull request; on main, build, smoke-test, scan and publish the image.
# Every third-party action is pinned to a full commit SHA (tags can be moved: see the Trivy
# compromise of March 2026). Update pins on purpose, never by accident.
name: ci

on:
  pull_request:          # every pull request: `test` is the required check that protects main
    branches: [main]
  push:                  # build and publish only when the service itself changes
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Train (the quality gate is inside)
        run: python -m src.train.train
      - name: Test
        run: pytest -q tests

  build:
    name: build, scan and publish
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the image after the commit
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do curl -fs localhost:8000/health >/dev/null && break; sleep 1; done
          curl -fs localhost:8000/health | tee health.json
          curl -fs -X POST localhost:8000/predict -H "Content-Type: application/json" -d @sample_request.json
          grep -q "${GITHUB_SHA::7}" health.json   # the running model says which commit built it
      - name: Scan with Trivy (fail on fixable critical issues)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          {
            echo "### Shipped"
            echo "| | |"; echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Model | \`$(cat health.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
